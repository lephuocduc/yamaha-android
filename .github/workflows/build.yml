name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare Gradle wrapper
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build_output.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yamaha-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release Latest APK (OTA Update)
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Bản cập nhật mới nhất (OTA)"
          body: "Bản dựng tự động từ nhánh main phục vụ tính năng Cập nhật phần mềm trực tiếp trong ứng dụng."
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push failure log to ci-log branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-log
          git add -f build_output.log
          git commit -m "build failure log" || true
          git push -f origin ci-log || true
